<!DOCTYPE html>
<html>
<head>
<title>Mango Got AI</title>

<style>
body{
    font-family:Arial;
    background:#ffb347;
    margin:0;
}

.header{
    background:#ff8c00;
    color:white;
    text-align:center;
    padding:20px;
    font-size:35px;
    font-weight:bold;
}

.chat{
    height:70vh;
    overflow-y:auto;
    padding:20px;
}

.bot{
    background:white;
    padding:10px;
    border-radius:15px;
    margin:10px;
    width:fit-content;
}

.user{
    background:#e0ffe0;
    padding:10px;
    border-radius:15px;
    margin:10px;
    margin-left:auto;
    width:fit-content;
}

.bottom{
    position:fixed;
    bottom:0;
    width:100%;
    display:flex;
    background:white;
}

input{
    flex:1;
    padding:15px;
    font-size:18px;
}

button{
    background:green;
    color:white;
    border:none;
    padding:15px 25px;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
🥭 Mango Got AI
</div>

<div id="chat" class="chat">
<div class="bot">
Yo! I'm Mango Got 🥭
</div>
</div>

<div class="bottom">
<input id="question" placeholder="Ask Mango Got anything...">
<button onclick="ask()">Ask</button>
</div>

<script>

function answer(q){

q=q.toLowerCase();

if(
q.includes("quantum") ||
q.includes("advanced calculus") ||
q.includes("string theory") ||
q.includes("11 dimensions")
){
return "Shiiiii idk 🤷🥭";
}

if(q.includes("hello") || q.includes("hi"))
return "What's good? 😎🥭";

if(q.includes("your name"))
return "I'm Mango Got AI 🥭";

if(q.includes("gravity"))
return "Gravity pulls things together.";

if(q.includes("sun"))
return "The Sun is a star.";

if(q.includes("earth"))
return "Earth is the planet we live on.";

if(q.includes("2+2"))
return "4 😎";

if(q.includes("capital of france"))
return "Paris 🇫🇷";

if(q.includes("joke"))
return "Why did the mango cross the road? Nobody knows. 🥭";

return "I think it's something to do with: " + q + " 🥭";
}

function ask(){

let q=document.getElementById("question").value;

if(q=="") return;

let chat=document.getElementById("chat");

chat.innerHTML +=
'<div class="user">'+q+'</div>';

chat.innerHTML +=
'<div class="bot">'+answer(q)+'</div>';

document.getElementById("question").value="";

chat.scrollTop=chat.scrollHeight;
}

</script>

</body>
</html>
